<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sprite Inventory</title>
  <style>
    :root { color-scheme: dark; --ink:#eef5ff; --muted:#97a8be; --panel:#142033; --line:#273950; --accent:#48c6b9; --warn:#f7b955; --danger:#ff7f7f; }
    * { box-sizing:border-box; } body { margin:0; font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; color:var(--ink); background:#0b1220; }
    main { max-width:1280px; margin:auto; padding:32px 20px 50px; } h1 { margin:0; font-size:clamp(26px,4vw,38px); } p { color:var(--muted); margin:6px 0 0; }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:25px 0 18px; } input, select { min-width:0; padding:11px 13px; border:1px solid var(--line); border-radius:9px; background:#0f1929; color:var(--ink); font:inherit; } #search { flex:1 1 250px; }
    button { padding:10px 14px; border:0; border-radius:8px; background:var(--accent); color:#062625; cursor:pointer; font-weight:700; font:inherit; } button.secondary { background:#263a54; color:var(--ink); } button.danger { background:transparent; color:var(--danger); padding:6px; }
    .summary { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-bottom:10px; } .card { background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:14px; } .card strong { display:block; font-size:25px; color:var(--accent); } .card span { color:var(--muted); font-size:13px; } .key { margin:0 0 18px; font-size:13px; }
    .type-tally { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin:0 0 18px; } .type-tally .card { padding:11px; } .type-tally .card strong { font-size:20px; } .type-tally h2 { grid-column:1 / -1; margin:0; font-size:16px; }
    .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:11px; background:var(--panel); } table { width:100%; min-width:820px; border-collapse:collapse; } th,td { padding:10px 12px; border-bottom:1px solid var(--line); text-align:center; white-space:nowrap; } th { position:sticky; top:0; background:#1c2c43; text-align:center; font-size:13px; } th:first-child, td:first-child { text-align:left; } tr:last-child td { border-bottom:0; } tr:hover td { background:#192942; }
    .qty { width:64px; padding:6px; text-align:center; border-radius:6px; } .max, .qty.max { color:var(--accent); font-weight:700; } .na { color:var(--muted); background:transparent; border-color:transparent; cursor:not-allowed; } .zero { color:#8192a8; } .remove-col { width:44px; }
    dialog { max-width:500px; width:calc(100% - 32px); color:var(--ink); background:#16243a; border:1px solid var(--line); border-radius:12px; padding:22px; } dialog::backdrop { background:#0009; } .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; } label { display:grid; gap:5px; font-size:13px; color:var(--muted); } dialog menu { display:flex; justify-content:flex-end; gap:10px; padding:0; margin:22px 0 0; }
    @media (max-width:600px) { main { padding:22px 12px; } .summary { grid-template-columns:1fr; } .type-tally { grid-template-columns:repeat(2,minmax(0,1fr)); } .form-grid { grid-template-columns:1fr; } }
    @page { size:letter portrait; margin:0.35in; }
    @media print { :root { color-scheme:light; } body { color:#000; background:#fff; font-size:9pt; } main { max-width:none; padding:0; } h1 { font-size:20pt; } p { color:#333; font-size:9pt; } .toolbar { display:none; } .summary { grid-template-columns:1fr; margin:12px 0; } .card, .table-wrap { color:#000; background:#fff; border-color:#888; } .summary .card { padding:7px 10px; } .card strong { display:inline; font-size:15pt; } .card span { color:#222; margin-left:8px; } .type-tally { grid-template-columns:repeat(4,1fr); gap:5px; margin-bottom:10px; } .type-tally h2 { font-size:11pt; } .type-tally .card { padding:4px 7px; } .type-tally .card strong { font-size:11pt; } .table-wrap { overflow:visible; border-radius:0; } table { min-width:0; table-layout:fixed; font-size:7.5pt; } th, td { padding:3px 2px; border-color:#aaa; white-space:normal; } th { position:static; background:#e8e8e8; } th:first-child, td:first-child { width:18%; } th:last-child, td:last-child { display:none; } .qty { width:100%; padding:0; border:0; background:transparent; color:#000; appearance:none; } .max { color:#000; font-weight:700; } .na { color:#555; } }
  </style>
</head>
<body>
  <main>
    <h1>Sprite Inventory</h1>
    <div class="toolbar"><input id="search" type="search" placeholder="Search item names…"><button id="add">Add item</button><button class="secondary" id="undo" disabled>Undo last change</button><button class="secondary" id="export">Export data to Excel</button><button class="secondary" id="print" type="button">Print</button></div>
    <section class="summary" aria-label="Inventory summary"><div class="card"><strong id="maxed">0</strong><span>Total Sprites Mastered</span></div></section><p class="key"><strong>M</strong> = Sprite Mastered</p>
    <section class="type-tally" aria-label="Owned by type"><h2>Owned by type</h2><div class="card"><strong id="type-normal">0</strong><span>Normal</span></div><div class="card"><strong id="type-cube">0</strong><span>Cube</span></div><div class="card"><strong id="type-gold">0</strong><span>Gold</span></div><div class="card"><strong id="type-gummy">0</strong><span>Gummy</span></div><div class="card"><strong id="type-galaxy">0</strong><span>Galaxy</span></div><div class="card"><strong id="type-gem">0</strong><span>Gem</span></div><div class="card"><strong id="type-holo">0</strong><span>Holo</span></div><div class="card"><strong id="type-quack">0</strong><span>Quack</span></div></section>
    <div class="table-wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
  </main>
    <dialog id="editor"><form method="dialog" id="form"><h2>Add sprite item</h2><div class="form-grid"><label>Item name<input required id="name" maxlength="60"></label><label>Normal<input id="normal" value="0"></label><label>Cube<input id="cube" value="0"></label><label>Gold<input id="gold" value="0"></label><label>Gummy<input id="gummy" value="0"></label><label>Galaxy<input id="galaxy" value="0"></label><label>Gem<input id="gem" value="0"></label><label>Holo<input id="holo" value="0"></label><label>Quack<input id="quack" value="0"></label></div><menu><button class="secondary" value="cancel">Cancel</button><button id="save" value="default">Save item</button></menu></form></dialog>
  <script>
    const types = ['Normal','Cube','Gold','Gummy','Galaxy','Gem','Holo','Quack'];
    const source = [
      ['John Wick','MAX','N/A','N/A','N/A','N/A','N/A','N/A','N/A'],['Batman','MAX',0,'MAX',0,0,0,'MAX',0],['Water','MAX',0,'MAX','MAX','MAX',2,'MAX','MAX'],['Earth','MAX','MAX',3,'MAX',1,'MAX',0,1],['Fire','MAX','MAX','MAX',1,'MAX',0,'MAX',0],['Duck',1,0,2,1,'MAX',4,0,0],['Ghost','MAX',0,'MAX',1,1,0,'MAX',0],['Dream','MAX',0,1,1,1,0,0,0],['Demon','MAX',0,'MAX',1,'MAX',1,0,0],['Punk','MAX',0,1,1,'MAX',0,0,0],['King','MAX',0,'MAX','MAX',0,0,'MAX',0],['Vini','MAX',0,0,0,0,0,0,0],['Peanut','MAX','N/A','N/A','N/A','N/A','N/A','N/A','N/A'],['Zero','MAX',0,'MAX','MAX','MAX',0,0,0],['Fishy','MAX',1,1,1,'MAX',0,0,0],['Striker',2,0,1,'MAX',1,0,'MAX',0],['Aura','MAX',0,2,'MAX','MAX',0,0,0],['Boss','MAX',1,'MAX',1,'MAX',0,0,0],['Grim','MAX',0,0,0,0,0,0,0],['Air','MAX',0,1,'MAX',2,0,2,0],['Seven','MAX',0,1,2,1,0,1,0],['Ironmouse','MAX',0,0,0,0,0,0,0],['Pollo','MAX',0,0,0,0,0,0,0],['Llama',1,0,1,0,1,0,0,0],['Peely','MAX',0,1,0,0,0,1,0]
    ];
    const key = 'sprite-inventory-v1', historyKey = 'sprite-inventory-history-v1'; let inventory = JSON.parse(localStorage.getItem(key) || 'null') || structuredClone(source); inventory = inventory.map(row => row.map(value => value === 'MAX' || value === 'Mastered' ? 'M' : value)); let undoStack = JSON.parse(localStorage.getItem(historyKey) || '[]');
    const body = document.querySelector('#body'), query = document.querySelector('#search');
    function save() { localStorage.setItem(key, JSON.stringify(inventory)); }
    function remember() { undoStack.push(structuredClone(inventory)); undoStack = undoStack.slice(-20); localStorage.setItem(historyKey, JSON.stringify(undoStack)); }
    function display(value) { return value === 'M' ? 'max' : value === 'N/A' ? 'na' : value === 0 || value === '0' ? 'zero' : ''; }
    function render() {
      document.querySelector('#head').innerHTML = '<th>Item</th>' + types.map(x=>`<th>${x}</th>`).join('') + '<th class="remove-col"></th>';
      const term = query.value.trim().toLowerCase(); const rows = inventory.filter(r=>r[0].toLowerCase().includes(term));
      body.innerHTML = rows.map(row => `<tr data-name="${row[0]}"><td>${row[0]}</td>${row.slice(1).map((v,i)=>`<td><input aria-label="${row[0]} ${types[i]}" class="qty ${display(v)}" value="${Number(v) === 0 ? '' : v}" data-index="${i+1}" ${v === 'N/A' ? 'disabled title="Not available"' : ''}></td>`).join('')}<td><button class="danger" aria-label="Remove ${row[0]}">×</button></td></tr>`).join('');
      const values = inventory.flatMap(r=>r.slice(1)); const owned = v => v === 'M' || (Number.isFinite(Number(v)) && Number(v) >= 1 && Number(v) <= 4); document.querySelector('#maxed').textContent=values.filter(v=>v==='M').length; types.forEach((type, i) => document.querySelector('#type-' + type.toLowerCase()).textContent = inventory.filter(row => owned(row[i + 1])).length); document.querySelector('#undo').disabled = undoStack.length === 0;
    }
    body.addEventListener('change', e => { if (!e.target.matches('.qty')) return; const row = inventory.find(r=>r[0]===e.target.closest('tr').dataset.name); const v=e.target.value.trim().toUpperCase(); const next = v === '5' || v === 'M' || v === 'MASTERED' || v === 'MAX' ? 'M' : (/^\d+$/.test(v) ? Number(v) : (v === 'N/A' ? v : 0)); if (row[Number(e.target.dataset.index)] === next) return; remember(); row[Number(e.target.dataset.index)] = next; save(); render(); });
    body.addEventListener('input', e => { if (!e.target.matches('.qty') || e.target.value.trim() !== '5') return; e.target.value = 'M'; e.target.dispatchEvent(new Event('change', {bubbles:true})); });
    body.addEventListener('click', e => { if (!e.target.matches('.danger')) return; const name = e.target.closest('tr').dataset.name; if (!confirm(`Remove ${name} from the inventory?`)) return; remember(); inventory = inventory.filter(r=>r[0]!==name); save(); render(); });
    query.addEventListener('input', render); document.querySelector('#export').onclick=()=>{ const quote = value => `"${String(value).replaceAll('"', '""')}"`; const csv = [['Type', ...types], ...inventory].map(row => row.map(quote).join(',')).join('\r\n'); const file = new Blob([csv], {type:'text/csv;charset=utf-8'}); const link = Object.assign(document.createElement('a'), {href:URL.createObjectURL(file), download:'Sprite_Inventory.csv'}); link.click(); URL.revokeObjectURL(link.href); };
    document.querySelector('#print').onclick=()=>window.print();
    document.querySelector('#undo').onclick=()=>{ if (!undoStack.length) return; inventory = undoStack.pop().map(row => row.map(value => value === 'MAX' || value === 'Mastered' ? 'M' : value)); localStorage.setItem(historyKey, JSON.stringify(undoStack)); save(); render(); };
    const dialog=document.querySelector('#editor'), form=document.querySelector('#form'); document.querySelector('#add').onclick=()=>{ form.reset(); dialog.showModal(); }; form.addEventListener('submit', e=>{ if (e.submitter.value==='cancel') return; e.preventDefault(); const row=[document.querySelector('#name').value.trim(), ...types.map(t=>{ const x=document.querySelector('#'+t.toLowerCase()).value.trim().toUpperCase(); return x === '5' || x === 'M' || x === 'MASTERED' || x === 'MAX' ? 'M' : (/^\d+$/.test(x)?Number(x):(x==='N/A'?x:0)); })]; if(inventory.some(r=>r[0].toLowerCase()===row[0].toLowerCase())) return alert('That item already exists.'); remember(); inventory.push(row); save(); dialog.close(); render(); });
    render();
  </script>
</body>
</html>
